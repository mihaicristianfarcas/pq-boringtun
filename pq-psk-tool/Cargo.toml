[package]
name = "pq-psk-tool"
description = "ML-KEM-768 key exchange tool for WireGuard PSK-slot post-quantum protection"
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"

[dependencies]
ml-kem = "0.3.0-rc.0"
clap = { version = "4", features = ["derive"] }
base64 = "0.22"
hex = "0.4"
getrandom = { version = "0.4", features = ["sys_rng"] }
rand_core = "0.10"
